<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg"
     style="background:#ffffff" font-family="Segoe UI, Arial, sans-serif">

  <!-- ── Title ── -->
  <text x="430" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">
    Offline RAG System — Microsoft Foundry Local
  </text>

  <!-- ══════════ USER ══════════ -->
  <rect x="30" y="160" width="120" height="80" rx="12"
        fill="#e8f1fb" stroke="#0078d4" stroke-width="2"/>
  <text x="90" y="192" text-anchor="middle" font-size="22">👤</text>
  <text x="90" y="213" text-anchor="middle" font-size="11" font-weight="600" fill="#0078d4">User</text>
  <text x="90" y="229" text-anchor="middle" font-size="10" fill="#555">Question / Answer</text>

  <!-- ── arrow: user → app ── -->
  <line x1="150" y1="200" x2="198" y2="200"
        stroke="#0078d4" stroke-width="2" marker-end="url(#a-blue)"/>
  <text x="174" y="193" text-anchor="middle" font-size="9" fill="#0078d4">question</text>

  <!-- ══════════ LOCAL RAG APP ══════════ -->
  <rect x="200" y="130" width="155" height="140" rx="12"
        fill="#ffffff" stroke="#0078d4" stroke-width="2.2"/>
  <text x="277" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#0078d4">⚙️ RAG Pipeline</text>
  <line x1="216" y1="166" x2="339" y2="166" stroke="#dde4f0" stroke-width="1.2"/>
  <text x="277" y="184" text-anchor="middle" font-size="10" fill="#555">1. Embed query</text>
  <text x="277" y="200" text-anchor="middle" font-size="10" fill="#555">2. Vector search</text>
  <text x="277" y="216" text-anchor="middle" font-size="10" fill="#555">3. Assemble context</text>
  <text x="277" y="232" text-anchor="middle" font-size="10" fill="#555">4. Call local model</text>
  <text x="277" y="253" text-anchor="middle" font-size="9" fill="#888">server + pipeline</text>

  <!-- ── arrow: app → answer back to user ── -->
  <line x1="200" y1="215" x2="152" y2="215"
        stroke="#0078d4" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#a-blue)"/>
  <text x="176" y="228" text-anchor="middle" font-size="9" fill="#0078d4">answer</text>

  <!-- ── arrow: app → sqlite ── -->
  <line x1="355" y1="170" x2="405" y2="120"
        stroke="#107c10" stroke-width="2" marker-end="url(#a-green)"/>
  <text x="388" y="140" text-anchor="middle" font-size="9" fill="#107c10">vector search</text>

  <!-- ══════════ SQLITE ══════════ -->
  <rect x="407" y="48" width="160" height="130" rx="12"
        fill="#f0faf0" stroke="#107c10" stroke-width="2"/>
  <text x="487" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#107c10">🗄️ SQLite DB</text>
  <line x1="423" y1="87" x2="551" y2="87" stroke="#c3e6c3" stroke-width="1.2"/>
  <text x="487" y="106" text-anchor="middle" font-size="10" fill="#555">Document Embeddings</text>
  <text x="487" y="122" text-anchor="middle" font-size="10" fill="#555">Text Chunks</text>
  <text x="487" y="138" text-anchor="middle" font-size="10" fill="#555">Cosine Similarity</text>
  <text x="487" y="163" text-anchor="middle" font-size="9" fill="#888">knowledge_base.db</text>

  <!-- ── arrow: sqlite → app (chunks) ── -->
  <line x1="407" y1="190" x2="357" y2="210"
        stroke="#107c10" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#a-green)"/>
  <text x="370" y="208" text-anchor="middle" font-size="9" fill="#107c10">top-3 chunks</text>

  <!-- ── arrow: app → foundry ── -->
  <line x1="355" y1="235" x2="405" y2="275"
        stroke="#8764b8" stroke-width="2" marker-end="url(#a-purple)"/>
  <text x="392" y="264" text-anchor="middle" font-size="9" fill="#8764b8">augmented prompt</text>

  <!-- ══════════ FOUNDRY LOCAL ══════════ -->
  <rect x="407" y="222" width="160" height="130" rx="12"
        fill="#f5f0fc" stroke="#8764b8" stroke-width="2"/>
  <text x="487" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#8764b8">🧠 Foundry Local</text>
  <line x1="423" y1="261" x2="551" y2="261" stroke="#d9c8f0" stroke-width="1.2"/>
  <text x="487" y="280" text-anchor="middle" font-size="10" fill="#555">phi-3.5-mini (3.8B)</text>
  <text x="487" y="296" text-anchor="middle" font-size="10" fill="#555">CPU / NPU inference</text>
  <text x="487" y="312" text-anchor="middle" font-size="10" fill="#555">On-device · Offline</text>
  <text x="487" y="338" text-anchor="middle" font-size="9" fill="#888">zero network calls</text>

  <!-- ── arrow: foundry → app (answer) ── -->
  <line x1="407" y1="270" x2="357" y2="240"
        stroke="#8764b8" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#a-purple)"/>
  <text x="373" y="250" text-anchor="middle" font-size="9" fill="#8764b8">answer</text>

  <!-- ══════════ EMBEDDING MODEL ══════════ -->
  <rect x="620" y="130" width="180" height="130" rx="12"
        fill="#fff8ec" stroke="#c8850a" stroke-width="2"/>
  <text x="710" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#c8850a">🔢 Embeddings</text>
  <line x1="636" y1="167" x2="784" y2="167" stroke="#f5d88a" stroke-width="1.2"/>
  <text x="710" y="186" text-anchor="middle" font-size="10" fill="#555">qwen3-embedding-0.6b</text>
  <text x="710" y="202" text-anchor="middle" font-size="10" fill="#555">1536-dim vectors</text>
  <text x="710" y="218" text-anchor="middle" font-size="10" fill="#555">Semantic similarity</text>
  <text x="710" y="245" text-anchor="middle" font-size="9" fill="#888">Foundry Local SDK</text>

  <!-- ── double arrow: app ↔ embedding ── -->
  <line x1="567" y1="190" x2="618" y2="190"
        stroke="#c8850a" stroke-width="1.8" marker-end="url(#a-orange)"/>
  <line x1="618" y1="205" x2="567" y2="205"
        stroke="#c8850a" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#a-orange-l)"/>
  <text x="593" y="185" text-anchor="middle" font-size="9" fill="#c8850a">embed</text>
  <text x="593" y="218" text-anchor="middle" font-size="9" fill="#c8850a">vector</text>

  <!-- ══════════ OFFLINE BADGE ══════════ -->
  <rect x="650" y="318" width="170" height="38" rx="19"
        fill="#d4edda" stroke="#107c10" stroke-width="1.5"/>
  <text x="735" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#107c10">
    ✅ 100% Offline
  </text>

  <!-- ══════════ ARROWHEAD DEFS ══════════ -->
  <defs>
    <marker id="a-blue"   markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#0078d4"/>
    </marker>
    <marker id="a-green"  markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#107c10"/>
    </marker>
    <marker id="a-purple" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#8764b8"/>
    </marker>
    <marker id="a-orange"   markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#c8850a"/>
    </marker>
    <marker id="a-orange-l" markerWidth="9" markerHeight="9" refX="2" refY="3.5" orient="auto">
      <path d="M9,0 L9,7 L0,3.5 z" fill="#c8850a"/>
    </marker>
  </defs>
</svg>
